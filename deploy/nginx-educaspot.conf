# Config de nginx del HOST (no corre en contenedor). Copiar a
# /etc/nginx/sites-available/educaspot.yettotools.com en el servidor — ver
# docs/despliegue.md.
#
# NOTA: yettotools.com (raíz) y www.yettotools.com ya están en uso por otro
# servicio en este servidor (proxy_pass a 127.0.0.1:3000) — EducaSpot vive
# en su propio subdominio para no pisarlo, igual que auth.yettotools.com y
# desktop.yettotools.com.
#
# El certificado ya fue emitido por certbot para este subdominio (ver
# docs/despliegue.md) — este archivo lo referencia directamente en vez de
# dejar que `certbot --nginx` reescriba el vhost (en este servidor
# multi-sitio, certbot eligió el vhost equivocado para clonar la primera
# vez; ver nota en despliegue.md).

server {
    listen 80;
    server_name educaspot.yettotools.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name educaspot.yettotools.com;

    ssl_certificate /etc/letsencrypt/live/educaspot.yettotools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/educaspot.yettotools.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Socket.io (chat en tiempo real) — necesita upgrade a websocket
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (SPA)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
