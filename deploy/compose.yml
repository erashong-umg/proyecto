# Stack de producción — se ejecuta en el servidor con podman-compose (o
# `podman compose`), NO en el repo/CI. Las imágenes vienen de GHCR, ya
# construidas por .github/workflows/deploy.yml; este archivo solo las corre.
#
# Setup inicial y comandos: ver docs/despliegue.md

services:
  mongodb:
    image: docker.io/library/mongo:8
    # "always" (no "unless-stopped"): systemd/podman-restart.service solo
    # re-arranca contenedores filtrando restart-policy=always tras un reboot
    # del host — ver docs/despliegue.md "Arranque automático tras reboot".
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: educaspot
      # Workaround para SERVER-121912: mongo:8 (TCMalloc) se niega a arrancar
      # en kernel Linux >= 6.19 por un cambio incompatible en rseq — ver
      # docs/despliegue.md. Quitar si el servidor baja de kernel o Mongo
      # publica un fix.
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Atado a 127.0.0.1: NO expuesto a internet. Acceso externo solo vía
      # túnel SSH — ver docs/despliegue.md "Conectarse a Mongo desde fuera".
      - "127.0.0.1:27017:27017"

  backend:
    image: ghcr.io/${GHCR_OWNER}/proyecto-backend:latest
    restart: always
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/educaspot?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: https://${DOMAIN}
      LOG_LEVEL: combined
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    image: ghcr.io/${GHCR_OWNER}/proyecto-frontend:latest
    restart: always
    ports:
      - "127.0.0.1:8080:80"

volumes:
  mongodb_data:
