name: Deploy

# Qué rama se despliega aparece en el título de cada ejecución.
run-name: Deploy — ${{ inputs.branch || github.ref_name }}

on:
  # Automático: cada push a main despliega main.
  push:
    branches: [main]
  # Manual: Actions → Deploy → Run workflow → lista "Rama a desplegar".
  workflow_dispatch:
    inputs:
      branch:
        description: Rama a desplegar en el servidor
        type: choice
        options:
          - main
          - release
          - develop
        default: main

# Un solo despliegue a la vez: dos ejecuciones simultáneas se pisarían en el servidor.
concurrency:
  group: deploy-prd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  # Ruta en el servidor donde vive deploy/compose.yml + .env (ver docs/despliegue.md)
  DEPLOY_PATH: ~/apps/educaspot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Mismo entorno que el deploy: aquí viven los secrets, y el build del
    # frontend necesita GOOGLE_CLIENT_ID (se compila dentro del SPA).
    environment: DEPLOY_PRD
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: backend-express
          - service: frontend
            context: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Manual: la rama elegida en la lista. Push: el commit que lo disparó.
          ref: ${{ inputs.branch || github.sha }}
          # Historial y tags completos: la versión visible se calcula con los tags.
          fetch-depth: 0

      # Qué se está construyendo: commit realmente construido (con otra rama,
      # github.sha no es este) y la versión que mostrarán el badge y /api/version.
      - name: Resolver versión
        id: src
        run: |
          short=$(git rev-parse --short HEAD)
          # "v1.2" si el commit está etiquetado; si no, el último tag por número de
          # versión + el commit ("v1.2+abc1234").
          exact=$(git describe --tags --exact-match 2>/dev/null || true)
          latest=$(git tag --sort=-v:refname | head -n 1)
          version="${exact:-${latest:+$latest+}$short}"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short=$short"
            echo "version=$version"
            echo "branch=${{ inputs.branch || github.ref_name }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Versión: $version (${{ inputs.branch || github.ref_name }}@$short)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push — ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            APP_VERSION=${{ steps.src.outputs.version }}
            APP_BRANCH=${{ steps.src.outputs.branch }}
            APP_COMMIT=${{ steps.src.outputs.short }}
            APP_BUILT_AT=${{ steps.src.outputs.built_at }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/proyecto-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/proyecto-${{ matrix.service }}:${{ steps.src.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: DEPLOY_PRD
    steps:
      - name: Resumen
        run: echo "Desplegando la rama ${{ inputs.branch || github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"

      # El workflow solo escribía el .env: el compose.yml del servidor se copió a
      # mano una vez y quedó desactualizado (el backend no recibía variables
      # nuevas como GOOGLE_CLIENT_ID). Ahora cada despliegue lo sincroniza desde
      # la misma rama que se construyó.
      - name: Checkout (solo compose.yml)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.sha }}
          sparse-checkout: deploy/compose.yml
          sparse-checkout-cone-mode: false

      - name: Preparar compose.yml
        id: compose
        run: echo "b64=$(base64 -w0 deploy/compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Desplegar en el servidor vía SSH
        uses: appleboy/ssh-action@v1
        env:
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
        with:
          envs: COMPOSE_B64
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            # Sincroniza compose.yml con el de la rama desplegada (queda una copia
            # de respaldo del anterior en compose.yml.bak).
            printf '%s' "$COMPOSE_B64" | base64 -d > compose.yml.new
            [ -s compose.yml.new ] || { echo "compose.yml vacío: se aborta" >&2; exit 1; }
            [ -f compose.yml ] && cp compose.yml compose.yml.bak
            mv compose.yml.new compose.yml

            cat > .env <<'ENVEOF'
            GHCR_OWNER=${{ secrets.GHCR_OWNER }}
            DOMAIN=${{ secrets.DOMAIN }}
            MONGO_ROOT_USERNAME=${{ secrets.MONGO_ROOT_USERNAME }}
            MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            ENVEOF
            podman-compose pull
            # `up -d` NO recrea contenedores que ya existen aunque haya una imagen
            # nueva (ni aplica un .env distinto): solo los vuelve a arrancar y el
            # servidor seguía con el código viejo. Se eliminan backend y frontend
            # para que `up -d` los cree de nuevo con la imagen y el .env actuales.
            # Mongo no se toca (sus datos están en el volumen mongodb_data).
            podman rm -f educaspot_backend_1 educaspot_frontend_1 || true
            podman-compose up -d
            podman image prune -f

            # Verifica que lo desplegado realmente responde; si no, falla el job.
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:4000/api/health >/dev/null 2>&1 \
                 && curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then ok=1; break; fi
              sleep 3
            done
            podman ps --format '{{.Names}}  {{.Image}}  {{.Status}}'
            if [ "$ok" != 1 ]; then
              echo "El backend o el frontend no respondió tras el despliegue" >&2
              podman logs --tail 40 educaspot_backend_1 >&2 || true
              exit 1
            fi
            echo "Despliegue verificado"
