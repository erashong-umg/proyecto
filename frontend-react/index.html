<!doctype html>
<html lang="es-GT">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Aplica el tema guardado antes del primer paint — sin esto, la página
      // pinta con el tema del sistema y luego "parpadea" al tema elegido en
      // cuanto React monta el store.
      (function () {
        try {
          var t = localStorage.getItem('edumarket_theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,600;0,700;1,600&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>EducaSpot — Marketplace Educativo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
