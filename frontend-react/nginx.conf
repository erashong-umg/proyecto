server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets con hash en el nombre (Vite) — cache larga: si cambian, cambia el nombre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Todo lo demás (index.html, el favicon, las fotos de /personas…) no lleva hash en el
    # nombre. "no-cache" no es "no guardar": el navegador pregunta si cambió (ETag) y solo
    # descarga de nuevo si cambió. Sin esto, tras un despliegue algunos clientes seguirían con
    # un index.html viejo que apunta a archivos de /assets ya borrados.
    #
    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (React Router maneja el resto en el cliente). Ese fallback es una redirección interna
    # que vuelve a entrar en este mismo location, por eso la cabecera también le llega.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
